# Two ecosystems, majors kept out of a group, and what ships kept apart from
# what does not.
#
# Grouping everything put TypeScript 7 in the same pull request as a Hono patch,
# so one breaking change held three safe ones. A major is its own branch: it is
# a decision, and the others are not.
#
# The npm groups split on `dependency-type`, because that is the line the risk
# already falls on. A production dependency is one this package installs for
# every app that installs it, so a fix there is ours to release. A development
# one is `vite` or `typescript`: both optional peers, both installed by the app
# itself, and neither loaded on the serve path. Holding the first behind the
# second is what the split exists to stop.
#
# Neither group is the security path. Dependabot's security updates run on their
# own trigger, ahead of this schedule and around the cooldown, and they are
# switched on for the repository rather than here. Without them a monthly
# interval and a seven day cooldown is how long an advisory waits.
#
# Only the root npm manifest is watched. The examples and the site depend on the
# framework by path, so eight more manifests would be eight more pull requests
# about the same lockfile.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A version has to be a week old before a pull request offers it. Most
    # malicious releases are pulled well inside that: the median takedown is 14
    # hours. What it costs is a week between a real fix and the offer of it, and
    # a bump can still be made by hand on the day it is needed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # As above. `.npmrc` sets `min-release-age=3` for what an install resolves,
    # which is the stricter gate of the two: this one only decides when a pull
    # request appears, and nothing installs from it until it is merged.
    cooldown:
      default-days: 7
    groups:
      # What this package installs for everybody: hono, its Node adapter, acorn,
      # jsep and parse5. A fix in one of these is ours to ship, so it travels
      # alone rather than behind a bundler.
      runtime:
        dependency-type: production
        update-types: [minor, patch]

      # What an app installs for itself. Same cadence, its own pull request, and
      # nothing here reaches a built app.
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # `@types/node` majors track Node majors, so this is a description of the
      # runtime rather than a dependency, and nothing checks that the
      # description is true. Ahead of `engines.node` it green-lights an API that
      # does not exist at run time: it type-checks and then throws. Raise it in
      # the same commit as `engines`, the CI `node-version`, and not otherwise.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
