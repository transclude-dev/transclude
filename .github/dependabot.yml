# Two ecosystems, and majors kept out of the group.
#
# Grouping everything put TypeScript 7 in the same pull request as a Hono patch,
# so one breaking change held three safe ones. A major is its own branch: it is
# a decision, and the others are not.
#
# Only the root npm manifest is watched. The examples and the site depend on the
# framework by path, so eight more manifests would be eight more pull requests
# about the same lockfile.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One pull request for everything that should not need reading.
      safe:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # `src/typecheck.js` uses the TypeScript compiler API, and 7.x moved it:
      # `ts.TypeFormatFlags` is undefined there, so the module does not load at
      # all. That is a port rather than a bump. Tracked separately; take this
      # entry out when it is done.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

      # `@types/node` majors track Node majors, so this is a description of the
      # runtime rather than a dependency, and nothing checks that the
      # description is true. Ahead of `engines.node` it green-lights an API that
      # does not exist at run time: it type-checks and then throws. Raise it in
      # the same commit as `engines`, the CI `node-version`, and not otherwise.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
