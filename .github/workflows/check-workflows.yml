# Lints everything in `.github`.
#
# A workflow file is the one place in this repository where a mistake hands
# someone else the credentials. zizmor reads for that class of mistake: a script
# that interpolates a branch name into a shell command, an action pinned to a
# tag that can be moved, a job holding a permission it does not use. The rules
# are at https://docs.zizmor.sh/audits/.
#
# `dependabot.yml` is audited too, so point a local run at `.github` and not at
# `.github/workflows`. The narrower path passes while this one fails, which is
# how the missing dependabot cooldown reached main:
#
#   docker run --rm -v "$(pwd):/repo:ro" ghcr.io/zizmorcore/zizmor:latest /repo/.github

name: check-workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # zizmor reads the repository's other workflows to audit them.
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `advanced-security: false`, because uploading SARIF needs GitHub
      # Advanced Security. Without it the action fails on the upload after the
      # audit has already passed, and the failure says nothing about the code.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
