# Everything a push runs, in one workflow and in order.
#
# Test and deploy used to be two workflows on the same trigger, so every push
# started both at once and the Actions page showed two runs per commit. They
# also repeated three steps.
#
# The duplication was the smaller half. Nothing made the deploy wait, so a
# commit that broke the framework suite still shipped: the deploy job never ran
# that suite, only the site's own. `needs: test` is the fix, and one workflow is
# what makes it possible.
#
# Publishing to npm is a tag, in publish.yml. A merge does not publish.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Pinned to a commit, here and below. A tag can be moved to point at other
      # code, and this job installs thirteen dependency trees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # A package per install. `npm ci` reads one manifest, and the examples
      # and the site are separate projects that depend on this one by path.
      # Counted rather than named: the number was written out here as eleven and
      # there are thirteen.
      - run: npm ci

      # Read rather than listed, the way `bin/release.js` reads it, so an example
      # added to the repository is covered without anyone remembering this file.
      # The list used to be written out by hand and `markdown` was missing from
      # the day it shipped: its suite ran with no dependencies installed and
      # nothing built, so every test that asks the built app for a URL skipped,
      # and the job stayed green while covering none of it.
      - name: Every example
        run: |
          for dir in examples/*/; do
            [ -f "$dir/package.json" ] || continue
            npm ci --prefix "$dir"
          done

      - run: npm ci --prefix www

      - run: npm test

      # The examples are built before they are tested: their tests ask the built
      # app for URLs, and skip when there is nothing to ask.
      - name: Every example, built
        run: |
          for dir in examples/*/; do
            [ -f "$dir/package.json" ] || continue
            npm run build --prefix "$dir"
          done

      - run: npm run test:examples

      # The site is built before it is tested: two of those tests read what the
      # build wrote, and skip when there is nothing to read.
      - run: npm run check --prefix www
      - run: npm run build --prefix www
      - run: npm test --prefix www

  # The checks only a browser can answer: a shadow boundary, a form counting a
  # custom element as a field, moveBefore. They live in the showcase at /check
  # and, until this job, ran when somebody remembered to open the page. The
  # runner image has Chrome already, so nothing is installed to drive it.
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm ci --prefix examples/showcase
      - run: npm run build --prefix examples/showcase
      - run: npm run test:browser --prefix examples/showcase

  # Every Node this package says it supports. `engines` says >=22 and this
  # workflow ran 22 alone, so 24 and 26 were a claim with nothing behind them.
  # The suite only, not the examples: the framework's own tests need no app and
  # take fifteen seconds, and the thirteen example builds are what makes the
  # `test` job long. Whatever a newer Node changes, it changes there first.
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      # Every version reports. Stopping at the first failure hides whether the
      # break is one version or all of them, which is the first thing to know.
      fail-fast: false
      matrix:
        # The floor, Active LTS, and Current.
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm test

  # The other three runtimes the README promises, against a running app.
  #
  # `test/portable.test.js` proves the core imports nothing from `node:`. That
  # is the shape of portability and not the fact of it, and the README promises
  # the fact. Until this job, Bun and Deno ran here exactly never, and workerd
  # only as a deploy of the site, which reports success for a page nobody asked
  # for. A runtime that stopped working would have kept its line in the README.
  #
  # TodoMVC because it is the smallest app that uses both paths: it renders a
  # compiled page and it has nothing but forms, so a POST reaches a verb export.
  runtimes:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - run: npm ci
      - run: npm ci --prefix examples/todomvc
      - run: npm run build --prefix examples/todomvc

      # Node too, though the `test` job covers the suite: what is checked here
      # is serving a built app, and Node is the baseline the other three are
      # compared against. A failure on all four reads differently from a failure
      # on one.
      - name: Node
        run: scripts/smoke.sh node examples/todomvc 1981 node node_modules/@transclude/core/bin/serve.js

      - name: Bun
        run: scripts/smoke.sh bun examples/todomvc 1982 bun node_modules/@transclude/core/bin/serve.bun.js

      - name: Deno
        run: scripts/smoke.sh deno examples/todomvc 1983 deno run -A node_modules/@transclude/core/bin/serve.deno.js

      # wrangler runs the real workerd, not a simulation of it.
      - name: workerd
        run: scripts/smoke.sh workerd examples/todomvc 1984 npx wrangler dev --port 1984 --ip 127.0.0.1

  deploy:
    needs: [test, browser, node, runtimes]
    # A pull request from a fork must not reach the Cloudflare secrets, and a
    # pull request has nothing to deploy anyway.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Tags, because the footer says whether this deploy is the release or
      # something after it, and it works that out by comparing HEAD to the tag
      # for the version in package.json. A checkout with no tags cannot tell,
      # and says "after" for safety, which would be every deploy including the
      # release itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # wrangler and what the worker imports. The site is built again rather
      # than carried over from the test job: a build from one commit is the same
      # bytes every time, and passing a directory between jobs is a failure mode
      # worth more than the ten seconds it saves.
      - run: npm ci
      - run: npm ci --prefix www
      - run: npm run build --prefix www

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        working-directory: www
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
