# Deploys the site, from main.
#
# The site is a worker rather than a directory of files. The landing page says a
# fragment is a URL and links to one, and `/?fragment=demo` is a render: a static
# host matches on path and ignores the query, so it would answer that link with
# the whole document.
#
# Publishing to npm is a tag. This is a push, because a docs change should reach
# the site without cutting a release.

name: deploy

on:
  push:
    branches: [main]
    paths: ['www/**', 'src/**', 'bin/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The site depends on the framework by path, so both are installed.
      - run: npm ci
      - run: npm ci --prefix www

      # What the test workflow checks, for the part being deployed. A site that
      # does not type-check is not one to publish.
      - run: npm run check --prefix www
      - run: npm run build --prefix www
      - run: npm test --prefix www

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        working-directory: www
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
