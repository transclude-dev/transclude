# Publishes both packages, from a tag.
#
# A merge does not publish. Every merge publishing means a version for every
# typo fix and no way to hold a release back, so the trigger is a tag that
# `npm run release` writes after everything has passed locally. CI runs it all
# again, because "it passed on my machine" is not the claim being made.
#
# There is no token. Both packages name this repository and this file as a
# trusted publisher, so npm accepts the OIDC identity `id-token: write` mints and
# signs provenance from it: the published package carries a verifiable link back
# to this workflow, this commit and this repository. Nothing to rotate, and
# nothing in the repository's secrets that could publish on its own.
#
# Three jobs, because only one of them may hold `id-token: write`. Anything that
# runs in a job with that permission can publish, and the tests install the
# framework, the demo and the site: hundreds of packages, any of which could ask
# npm for a release. So `test` installs and holds no identity, `publish` holds
# the identity and installs nothing, and `release` writes the page with
# `contents: write` and no identity at all. Every action is pinned to a commit,
# because a tag can be moved to point at other code.

name: publish

on:
  push:
    tags: ['v*']

  # The same jobs, started by hand, for when the tag push does not start them.
  #
  #   gh workflow run publish.yml --ref v0.8.1
  #
  # Added after a tag push produced a run that queued forever and could not be
  # cancelled, rerun or drained: `gh run cancel` called it completed, `gh run
  # rerun` called it already running, and `gh run list` called it queued. Nothing
  # restarts a push event, and deleting and re-pushing the tag fired nothing.
  #
  # Dispatch against the tag, not against a branch. Everything below reads the
  # version from `GITHUB_REF_NAME`, which is whichever ref this was started on,
  # and the check that the tag and the manifests agree is what catches the
  # mistake: dispatched from `main` it compares `main` against `0.8.1` and stops
  # before anything is staged.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache, in a workflow a tag starts. A cache is written by whatever ran
      # last and read by whatever runs next, so a poisoned entry from an earlier
      # run would reach the tree this release is cut from. Slower, and the only
      # thing it costs is time.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Three packages, three installs. `npm ci` reads one manifest, and the
      # demo and the docs are separate projects that depend on this one by path.
      # Without theirs, their tests cannot resolve `@transclude/core` and fail
      # for a reason that has nothing to do with the release.
      #
      # `--ignore-scripts` because a dependency's install script runs arbitrary
      # code, and nothing here needs one.
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix examples/showcase --ignore-scripts
      - run: npm ci --prefix www --ignore-scripts

      # The same order `bin/release.js` runs, so a tag that was cut properly
      # passes here and a tag pushed by hand is caught.
      - run: npm test
      - run: npm run test:examples
      - run: npm run check --prefix www
      # Before the docs tests: two of them read what the build wrote, and skip
      # when there is nothing to read.
      - run: npm run build --prefix www
      - run: npm test --prefix www

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # A shallow checkout of the tag, and no `fetch-tags`. The release notes
      # need the tag object, and they are read in the job below. This one reads
      # the two manifests and the files each package ships.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 26 for the npm it carries. `npm stage` arrived in npm 11.19, and
      # the npm bundled with Node 22 is older than that. Installing a newer npm
      # here instead would put a registry download inside the one job that can
      # publish, which is the thing this split exists to prevent.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false

      # The tag says what version this is. A tag that disagrees with the
      # manifests would stage something nobody asked for.
      - name: The tag and the manifests agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in package.json create/package.json; do
            version=$(node -p "require('./$manifest').version")
            if [ "$version" != "$tag" ]; then
              echo "$manifest is $version and the tag is $tag"
              exit 1
            fi
          done

      # `stage publish`, not `publish`. Both packages deny plain `npm publish`,
      # so this run cannot release anything on its own: it uploads the tarball
      # and stops. The version goes live when a human approves it on npmjs.com
      # with their second factor, which is the step a stolen CI run cannot fake.
      #
      # No `npm ci` above, and none here. The tarball is the tree the tag points
      # at, filtered by `files`, and neither package builds anything first.
      - name: Stage @transclude/core
        run: npm stage publish --access public --ignore-scripts

      - name: Stage @transclude/create
        run: npm stage publish --access public --ignore-scripts
        working-directory: create

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # `write` for the release page. Nothing here pushes a commit, and nothing
      # here can talk to npm.
      contents: write

    steps:
      # `fetch-depth: 0` and `fetch-tags`, because the release notes are the tag's
      # own message. A shallow checkout of a tag gives the commit and not the tag
      # object, so `%(contents)` comes back empty and the release page is blank.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # The page goes up while both packages are still staged, so it names a
      # version the registry does not serve yet. That gap is the approval, and it
      # lasts as long as it takes to press the button. The alternative is a
      # release page that only appears after a human acts, which means a tag with
      # no notes for anyone reading GitHub in the meantime.
      - name: The release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "the tag carries no message, so there are no notes to publish"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
