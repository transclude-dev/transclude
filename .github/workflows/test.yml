# Everything the publish workflow checks, on every push and pull request.
#
# Without this the only thing that runs the suite is a tag, so a broken commit
# on main is found at release time, which is the worst moment to find it. Four
# of these steps failed on the way to the first release and every one of them
# would have shown up here instead.
#
# No token, no publish, no `id-token`. It reads and reports.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Three packages, three installs. `npm ci` reads one manifest, and the
      # demo and the docs are separate projects that depend on this one by path.
      - run: npm ci
      - run: npm ci --prefix examples/showcase
      - run: npm ci --prefix www

      - run: npm test
      - run: npm run test:examples

      # The docs are built before they are tested: two of those tests read what
      # the build wrote, and skip when there is nothing to read.
      - run: npm run check --prefix www
      - run: npm run build --prefix www
      - run: npm test --prefix www
