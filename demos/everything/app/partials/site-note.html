<script>
  // The element's public API. These land on the prototype, so
  // `document.querySelector('site-note').dismiss()` works from anywhere.
  export const prototype = {
    dismiss() {
      this.hidden = true;
      this.dispatchEvent(new CustomEvent('dismiss', { bubbles: true }));
    },
    /** @returns {boolean} */
    get dismissed() {
      return this.hidden;
    },
  };

  // A partial upgrades for behaviour. `host` is the element; there is no shadow
  // root, so `shadow` is null.
  //
  // `signal` aborts when the element leaves the document, so a listener given
  // it removes itself. Nothing here has to name the teardown, and nothing can
  // forget it. For anything without a signal of its own, return a function
  // instead. That is the other half of the same agreement.
  document.addEventListener(
    'keydown',
    (event) => {
      if (event.key === 'Escape') host.dismiss();
    },
    { signal },
  );
</script>
