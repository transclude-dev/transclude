  // mark the active link. That comes from ctx, the same way a page gets it.
  export default async ({ route }) => ({

    links: [
      { href: "/", label: "Home" },
      { href: "/people/ada-lovelace", label: "Dynamic route" },
      { href: "/docs/guide/getting-started", label: "Catch-all" },
      { href: "/check", label: "Client checks" },
      { href: "/nope", label: "404" },
    ],
  });
</script>

<!-- An external head script. `src` and every other attribute survive now; they
     used to be dropped, which emitted `<script></script>` and loaded nothing. -->
<script head src="/theme.js" type="module"></script>

<script head>
  // View transition diagnostics. Off unless asked for:
  //   ?vtdebug   once, or   localStorage.vtdebug = 1   to keep it on.
  //
  // The outgoing page's logs are wiped by the navigation unless DevTools has
  // "Preserve log" ticked, so pageswap records to sessionStorage and the
  // arriving page prints both halves together. One console read, whole story.
  if (location.search.includes("vtdebug") || localStorage.getItem("vtdebug")) {
    const log = (...args) =>
      console.log("%c[vt]", "color:#3b3bb0;font-weight:bold", ...args);

    addEventListener("pageswap", (event) => {
      sessionStorage.setItem(
        "vt:swap",
        JSON.stringify({
          from: location.pathname,
          to: event.activation?.entry?.url ?? null,
          startedOnLeaving: Boolean(event.viewTransition),
          names: named(),
        }),
      );
    });

    addEventListener("pagereveal", async (event) => {
      const swap = JSON.parse(sessionStorage.getItem("vt:swap") ?? "null");
      sessionStorage.removeItem("vt:swap");

      log(
        "navigation",
        swap
          ? `${swap.from} -> ${location.pathname}`
          : `(fresh load) ${location.pathname}`,
      );
      if (swap)
        log(
          "  leaving:  started =",
          swap.startedOnLeaving,
          "| names:",
          swap.names.join(", ") || "none",
        );
      log(
        "  arriving: started =",
        Boolean(event.viewTransition),
        "| names:",
        named().join(", ") || "none",
      );

      if (!event.viewTransition) {
        log(
          "  -> no transition. If the leaving side started one, the arriving document declined it.",
        );
        return;
      }
      try {
        await event.viewTransition.ready;
        log("  -> ready, animating");
      } catch (error) {
        log("  -> SKIPPED:", error?.message ?? error);
      }
    });

    function named() {
      const found = [];
      for (const el of document.querySelectorAll("*")) {
        const name = getComputedStyle(el).viewTransitionName;
        if (name && name !== "none") found.push(name);
      }
      return found;
    }
  }
</script>

<!-- Hold the transition until the content it will animate has parsed.
     Without this the incoming snapshot can be taken of a half-built page, and
     the transition runs on the wrong thing. Must be in <head>, which is
     where a top-level <link> is hoisted to. -->
<link rel="expect" href="#lead-content" blocking="render" />

<div class="shell">
  <header>
    <nav>
      <a
        each="link of links"
        href="${link.href}"
        aria-current="${link.href === path}"
        >${link.label}</a
      >
    </nav>
  </header>

  <div class="columns">
    <main id="lead-content">
      <slot></slot>
    </main>
    <aside>
      <slot name="aside">
        <p class="quiet">Pages can fill this by declaring a named slot.</p>
      </slot>
    </aside>
  </div>

  <footer>Rendered on the server. <code>${path}</code></footer>
</div>
