<script server>
  // A record, on its own, for somebody else's page.
  //
  // Two things use this and they use it differently:
  //
  //   <transclude src="https://atlas.../embed/<uri>#record">   server side
  //   <at-record uri="at://...">                               client side
  //
  // The first is another transclude app, which fetches this page while rendering
  // its own and pulls `#record` out of it. The second is a browser, which asks
  // for `?fragment=record` and gets that markup alone. Both read the same
  // element the main view renders, so an embed can never disagree with the page
  // it came from.
  //
  // The contract, and the reason for every decision below: **this URL always
  // returns HTML you can put on a page.** An embed outlives the record it points
  // at, and a blog post from last year should not develop a hole.

  import { kindOf, parseAtUri } from '../../lib/aturi.js';
  import { resolveIdentity } from '../../lib/identity.js';
  import { recordDef, resolveLexicon } from '../../lib/lexicon.js';
  import { fieldsFor } from '../../lib/resolve.js';
  import { getRecord } from '../../lib/xrpc.js';
  import { createTrace } from '../../lib/trace.js';

  // Five minutes in the app's own cache. The rest is on the response, because
  // an embed is read by other people's readers and the copy that matters is the
  // one in a shared cache between here and them.
  export const revalidate = 300;

  export default async ({ params, response }) => {
    // Open, and open on purpose. An embed that only worked from an allowed list
    // of origins would not be an embed. Nothing here is private: every record
    // this serves is already readable by anybody who asks its PDS directly.
    response.headers.set('access-control-allow-origin', '*');
    response.headers.set('access-control-allow-methods', 'GET, HEAD');

    // Cached hard, because the traffic is not this app's. An embed means
    // arbitrary sites sending readers at this server, which sends them at
    // somebody else's PDS. `stale-while-revalidate` is the part that protects
    // them: for a day after a copy goes stale it is still served, and the
    // refetch happens once, behind the reader.
    response.headers.set('cache-control', 'public, max-age=300, stale-while-revalidate=86400');

    const trace = createTrace();

    try {
      const at = parseAtUri(params.uri);
      if (kindOf(at) !== 'record') throw new Error('An embed names one record: an authority, a collection and a key.');

      const identity = await resolveIdentity(at.authority, trace);
      const view = await read(at, identity, trace);

      return { at, identity, ...view, gone: null };
    } catch (error) {
      // A tombstone, and a 200 with it.
      //
      // The alternative is a 404, which makes `<transclude>` fall through to
      // whatever the author wrote as a fallback. Their reader then has no way to
      // know a record was ever there. This says what was asked for and what
      // happened to it, which is the more useful of the two and the reason the
      // contract above is worded the way it is.
      return { ...EMPTY, uri: safeUri(params.uri), gone: error.message };
    }
  };

  const EMPTY = { at: null, identity: null, raw: null, fields: [], schema: false, uri: '' };

  async function read(at, identity, trace) {
    const { pds, did } = identity;

    const lexicon = await resolveLexicon(at.collection, trace);
    const record = await getRecord(pds, did, at.collection, at.rkey, trace);

    return {
      raw: record,
      schema: Boolean(lexicon),
      uri: at.uri,
      fields: await fieldsFor(record.value, recordDef(lexicon), { did, pds, own: lexicon }, trace),
    };
  }

  /** What to call the record on a tombstone, when even parsing it failed. */
  function safeUri(input) {
    try {
      return parseAtUri(input).uri;
    } catch {
      return `at://${input}`;
    }
  }
</script>

<title>${gone ? uri : at.uri} · atlas</title>
<meta name="robots" content="noindex" />

<style>
  /* An embed lands in somebody else's page, and the point of serving HTML
     rather than an iframe is that their CSS reaches it. So this styles the
     frame and nothing inside it: no font, no color, no size on the text. A
     direct visit to this URL gets the site stylesheet and looks finished; a
     fragment pulled into another page inherits that page instead. */
  .tombstone {
    border: 1px solid var(--line, #dee2e8);
    border-left: 3px solid var(--muted, #6b7280);
    border-radius: 8px;
    padding: 0.9rem 1.1rem;
  }
  .tombstone p {
    margin: 0 0 0.4rem;
  }
  .tombstone p:last-child {
    margin-bottom: 0;
  }
  .tombstone .uri {
    word-break: break-all;
  }
  .source {
    margin-top: 0.6rem;
    font-size: 0.78rem;
  }
</style>

<div id="record" fragment>
  <!-- The styling that travels with an embed.

       An element's CSS is hoisted into the pages that render it, and a page that
       receives this markup at runtime never rendered it. So nothing about
       `record-card` or `field-list` is known where this lands, and without the
       rules below a record arrives as an unstyled definition list: no columns,
       no nesting, and `display: inline` on both tag names.

       What is here is structure, plus a restrained default that inherits.
       No font-family, no font-size on the record's own text, no background, and
       every color is `currentColor`. So an embed takes the host page's type and
       palette and looks like it belongs there, which is the reason for serving
       HTML rather than an iframe. Element selectors only, so a host overrides
       any of it with a single class. -->
  <style>
    record-card,
    field-list {
      display: block;
    }

    record-card {
      border: 1px solid color-mix(in oklab, currentColor 18%, transparent);
      border-radius: 10px;
      padding: 1rem 1.15rem;
    }

    record-card > header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.3rem 0.9rem;
      padding-bottom: 0.7rem;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid color-mix(in oklab, currentColor 14%, transparent);
    }

    record-card .uri,
    record-card .cid {
      font-family: ui-monospace, monospace;
      font-size: 0.8em;
      opacity: 0.7;
      word-break: break-all;
      margin: 0;
      flex: 1 1 18rem;
    }
    record-card .cid {
      font-size: 0.72em;
      margin-top: 0.9rem;
    }

    record-card .badge {
      font-size: 0.72em;
      border: 1px solid color-mix(in oklab, currentColor 18%, transparent);
      border-radius: 999px;
      padding: 0.05rem 0.6rem;
      opacity: 0.75;
      white-space: nowrap;
    }

    /* The two-column field grid, and the indent that carries nesting. Without
       these the record is legible but says nothing about its own shape. */
    field-list dl {
      margin: 0;
      display: grid;
      grid-template-columns: minmax(5rem, 11rem) minmax(0, 1fr);
      gap: 0.1rem 1.25rem;
    }

    field-list dt {
      font-family: ui-monospace, monospace;
      font-size: 0.8em;
      opacity: 0.65;
      padding: 0.3rem 0 0.3rem calc(var(--depth, 0) * 0.9rem);
      word-break: break-all;
    }

    field-list dd {
      margin: 0;
      padding: 0.3rem 0;
      min-width: 0;
      word-wrap: break-word;
    }

    field-list .prose {
      white-space: pre-wrap;
    }

    field-list .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    field-list .chips li {
      border: 1px solid color-mix(in oklab, currentColor 18%, transparent);
      border-radius: 999px;
      padding: 0.05rem 0.55rem;
      font-size: 0.78em;
    }

    field-list .note,
    field-list .group {
      display: block;
      font-size: 0.75em;
      opacity: 0.6;
    }
    field-list .group {
      display: inline;
      font-family: ui-monospace, monospace;
    }

    field-list .meter {
      display: inline-block;
      width: 4rem;
      height: 3px;
      background: color-mix(in oklab, currentColor 18%, transparent);
      border-radius: 2px;
      vertical-align: middle;
      margin-left: 0.5rem;
      overflow: hidden;
    }
    field-list .meter > span {
      display: block;
      height: 100%;
      background: currentColor;
      opacity: 0.5;
    }

    field-list img {
      max-width: min(100%, 22rem);
      height: auto;
      border-radius: 6px;
      display: block;
    }

    field-list .mono,
    field-list time {
      font-family: ui-monospace, monospace;
      font-size: 0.85em;
    }

    @media (max-width: 34rem) {
      field-list dl {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
      }
      field-list dd {
        margin-bottom: 0.7rem;
      }
    }
  </style>

  <template if="gone">
    <div class="tombstone">
      <p>This record is not available.</p>
      <p class="uri mono">${uri}</p>
      <p class="muted">${gone}</p>
    </div>
  </template>

  <template else>
    <record-card uri="${at.uri}" cid="${raw.cid}" collection="${at.collection ?? ''}" schema="${schema}">
      <field-list fields="${fields}"></field-list>
    </record-card>
    <p class="source">
      <a href="/at/${at.authority}/${at.collection}/${at.rkey}">Read this record on atlas</a>
    </p>
  </template>
</div>
