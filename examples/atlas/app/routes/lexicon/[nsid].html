<script server>
  // A schema is a record, so this page is the record view with a different
  // renderer. It reads the same `getRecord` through the same chain, and the
  // only thing that makes it a schema page is what it does with the value.

  import { isNsid, nsidAuthorities } from '../../lib/aturi.js';
  import { reposUsing } from '../../lib/discover.js';
  import { resolveIdentity } from '../../lib/identity.js';
  import { recordDef, referencedNsids, resolveLexicon, resolveMany } from '../../lib/lexicon.js';
  import { fieldsOf } from '../../lib/render.js';
  import { listRecords } from '../../lib/xrpc.js';
  import { createTrace, traceMs } from '../../lib/trace.js';

  export const revalidate = 3600;

  export default async ({ params, response }) => {
    const trace = createTrace();
    const nsid = params.nsid;

    if (!isNsid(nsid)) {
      response.status = 404;
      return { ...EMPTY, nsid, hops: [], ms: 0, error: `"${nsid}" is not an NSID.` };
    }

    try {
      const lexicon = await resolveLexicon(nsid, trace);

      if (!lexicon) {
        // Nobody published one. This is an ordinary outcome on this network and
        // the page says so rather than showing an error.
        response.status = 404;
        return { ...EMPTY, nsid, hops: trace.hops, ms: traceMs(trace), error: null, searched: nsidAuthorities(nsid) };
      }

      // Who uses it, and one record that does. Both come from an index rather
      // than from the network itself, and both are optional: a page that cannot
      // reach them renders without them.
      const users = await reposUsing(nsid, 12, trace);
      const example = await sample(nsid, lexicon, users, trace);

      return {
        ...EMPTY,
        nsid,
        lexicon,
        defs: Object.entries(lexicon.schema.defs ?? {}).map(([name, def]) => ({ name, def })),
        properties: propertiesOf(recordDef(lexicon)),
        needs: referencedNsids(lexicon),
        users,
        example,
        hops: trace.hops,
        ms: traceMs(trace),
        error: null,
      };
    } catch (error) {
      response.status = 502;
      return { ...EMPTY, nsid, hops: trace.hops, ms: traceMs(trace), error: error.message };
    }
  };

  const EMPTY = {
    lexicon: null,
    defs: [],
    properties: [],
    needs: [],
    searched: [],
    users: [],
    example: null,
    error: null,
  };

  /** How many repositories to try before giving up on finding an example. */
  const TRIES = 3;

  /**
   * One real record of this type, rendered by this lexicon.
   *
   * A schema page that shows only the definition asks the reader to imagine what
   * a record looks like. This is the same field registry the record view uses,
   * so what they see here is what they will see there.
   *
   * The first repository the relay names may be unreachable, or may have
   * deleted everything. Three tries, then the page does without.
   */
  async function sample(nsid, lexicon, users, trace) {
    const def = recordDef(lexicon);
    if (!def) return null;

    const lexicons = await resolveMany(referencedNsids(lexicon), trace);

    for (const did of users.slice(0, TRIES)) {
      try {
        const identity = await resolveIdentity(did, trace);
        const page = await listRecords(identity.pds, did, nsid, { limit: 1 }, trace);
        const record = page.records?.[0];
        if (!record) continue;

        const rkey = record.uri.split('/').pop();
        return {
          uri: record.uri,
          href: `/at/${did}/${nsid}/${rkey}`,
          fields: fieldsOf(record.value, def, { did, pds: identity.pds, own: lexicon, lexicons }),
        };
      } catch {
        // This repository did not work out. The next one might.
      }
    }

    return null;
  }

  /**
   * The field table. Every property of the record, with the constraints the
   * lexicon put on it, flattened to one row each.
   */
  function propertiesOf(def) {
    if (!def?.properties) return [];
    const required = new Set(def.required ?? []);

    return Object.entries(def.properties).map(([name, property]) => ({
      name,
      required: required.has(name),
      type: typeOf(property),
      format: property.format ?? null,
      description: property.description ?? null,
      limits: limitsOf(property),
      ref: refOf(property),
    }));
  }

  /** What the schema calls this field, including what an array holds. */
  function typeOf(property) {
    if (property.type !== 'array') return property.type;
    return `array of ${property.items?.type ?? 'unknown'}`;
  }

  /** Every bound the schema put on a value, as one line. */
  function limitsOf(property) {
    const parts = [];
    const source = property.type === 'array' ? property.items ?? {} : property;

    if (property.type === 'array' && property.maxLength) parts.push(`up to ${property.maxLength} items`);
    if (source.maxGraphemes) parts.push(`${source.maxGraphemes} graphemes`);
    else if (source.maxLength && property.type !== 'array') parts.push(`${source.maxLength} bytes`);
    if (source.maxSize) parts.push(`${Math.round(source.maxSize / 1024)} KB`);
    if (source.enum) parts.push(source.enum.join(', '));
    if (source.const !== undefined) parts.push(`always ${source.const}`);

    return parts.join(' · ');
  }

  /** Which other schemas this field points at. */
  function refOf(property) {
    const source = property.type === 'array' ? property.items ?? {} : property;
    const refs = source.ref ? [source.ref] : (source.refs ?? []);
    return refs.map((ref) => ({ ref, href: ref.startsWith('#') ? null : `/lexicon/${ref.split('#')[0]}` }));
  }
</script>

<title>${nsid} · atlas</title>
<meta name="description" content="The lexicon for ${nsid}, resolved from the network." />

<template if="error">
  <div class="missing">
    <h1 class="mono">${nsid}</h1>
    <p>${error}</p>
  </div>
</template>

<template else-if="!lexicon">
  <div class="missing">
    <h1 class="mono">${nsid}</h1>
    <p>No lexicon is published for this name.</p>
    <p class="muted">
      Most record types on this network have no published schema. Records of this
      type still render, field by field, from what they carry.
    </p>
    <p class="muted">
      Asked: <span each="domain of searched" class="mono">_lexicon.${domain} </span>
    </p>
  </div>
</template>

<template else>
  <h1>${nsid}</h1>
  <p class="published">
    Published by <a href="/did/${lexicon.did}" class="mono">${lexicon.did}</a>
  </p>

  <div id="schema" fragment>
    <h2>Fields</h2>

    <div class="scroller">
      <table>
        <thead>
          <tr>
            <th>Field</th>
            <th>Type</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>
          <tr each="property of properties">
            <td class="name" data-lights="${property.name}" tabindex="0">
              ${property.name}<span class="req" if="property.required" title="required">*</span>
            </td>
            <td class="type">
              ${property.type}<template if="property.format">, ${property.format}</template>
              <span class="limits" if="property.limits">${property.limits}</span>
            </td>
            <td>
              <template if="property.description">${property.description}</template>
              <span each="entry of property.ref">
                <a if="entry.href" href="${entry.href}" class="mono">${entry.ref}</a>
                <span else class="mono muted">${entry.ref}</span>
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="muted" if="!properties.length">
      This lexicon defines no record. It is a query, a procedure, or a set of
      types other lexicons point at.
    </p>
  </div>

  <template if="example">
    <h2>A record of this type</h2>
    <p class="muted hint">
      Real, and read just now. Hover a field name in the table above to find it
      here.
    </p>
    <div class="example" id="example" fragment>
      <field-list fields="${example.fields}"></field-list>
    </div>
    <p class="source"><a href="${example.href}" class="mono">${example.uri}</a></p>
  </template>

  <template if="users.length">
    <h2>Used by</h2>
    <p class="muted hint">
      Repositories carrying this collection, as a relay saw them. Not a count of
      everyone.
    </p>
    <ul class="plain">
      <li each="did of users">
        <a href="/at/${did}" class="mono">${did}</a>
      </li>
    </ul>
  </template>

  <template if="needs.length">
    <h2>Points at</h2>
    <ul class="plain">
      <li each="other of needs">
        <a href="/lexicon/${other}" class="mono">${other}</a>
      </li>
    </ul>
  </template>

  <h2>Definitions</h2>
  <ul class="plain">
    <li each="entry of defs"><code>${entry.name}</code> <span class="muted">${entry.def.type}</span></li>
  </ul>

  <details>
    <summary>Raw</summary>
    <pre id="raw" fragment>${JSON.stringify(lexicon.schema, null, 2)}</pre>
  </details>

  <!-- The one interaction on this site worth real JavaScript: a field's name in
       the table, and that field in the live record, are the same thing seen
       twice, and nothing static can say so.
       
       A plain script rather than an element. It exists on this page only and it
       would wrap the whole page, which is not what an element is for. With
       JavaScript off the table and the record are both still there, which is
       the whole page minus one convenience. -->
  <script type="module">
    const page = document.currentScript?.parentNode ?? document;
    const example = document.getElementById('example');

    if (example) {
      let lit = [];

      const clear = () => {
        for (const node of lit) node.removeAttribute('data-lit');
        lit = [];
      };

      const light = (name) => {
        clear();
        // Depth 0 only. A nested field can share a name with a top-level one,
        // and lighting both would point at the wrong row.
        // The backslash below is required. This script sits in a page, and the
        // page compiler reads a dollar sign followed by a brace as its own
        // interpolation before a browser ever sees the file. Writing that pair
        // in this comment breaks the build too, which is how it was found.
        lit = [...example.querySelectorAll(`[data-field="\${name}"][data-depth="0"]`)];
        for (const node of lit) node.setAttribute('data-lit', '');
      };

      for (const cell of document.querySelectorAll('[data-lights]')) {
        const name = cell.dataset.lights;
        cell.addEventListener('pointerenter', () => light(name));
        cell.addEventListener('focus', () => light(name));
        cell.addEventListener('pointerleave', clear);
        cell.addEventListener('blur', clear);
      }
    }
  </script>
</template>

<template slot="trace">
  <trace-rail hops="${hops}" ms="${ms}"></trace-rail>
</template>
