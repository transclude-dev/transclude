<h1>About</h1>

<p>
  A blog with three posts, built to show the static half of
  <a href="https://transclude.dev">transclude</a>. Every page you can reach from
  here was written to a file by <code>npm run build</code>.
</p>

<p>
  There is no database and no admin. The posts are an array in
  <code>app/data/posts.js</code>. Read Markdown off disk instead and nothing in
  the routes changes.
</p>
