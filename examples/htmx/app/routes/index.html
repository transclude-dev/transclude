<script server>
  // The same job as the `search` example, driven by htmx instead of a fetch.
  //
  // Nothing in this file mentions htmx. The fragment below is a fragment; the
  // attributes that ask for it are markup. Swap htmx for Turbo, or for the
  // twenty lines in `examples/search`, and the server side does not change.
  import { search, add, remove, all } from '../data/people.js';

  export const prerender = false;

  export default async ({ url }) => {
    const q = new URL(url).searchParams.get('q') ?? '';

    return { q, people: search(q), total: all().length };
  };

  export const POST = async ({ request, url, fragment }) => {
    const form = await request.formData();

    if (form.get('intent') === 'remove') {
      remove(Number(form.get('id')));
    } else {
      const name = String(form.get('name') ?? '').trim();
      if (name) add(name, String(form.get('role') ?? '').trim());
    }

    // `ctx.fragment` is how one handler serves both callers. htmx named a
    // fragment, so answer with that fragment: a redirect would make it swap a
    // whole document into a list. A form submission with no script named none,
    // and gets the redirect, which is what stops a reload repeating the change.
    if (fragment) return undefined;

    return Response.redirect(new URL(url), 303);
  };
</script>

<title>People, with htmx</title>
<meta name="description" content="Fragments driven by htmx, using the HX-Target header." />

<script src="/htmx.min.js" defer></script>

<h1>People</h1>

<p class="lede">
  The list below is a fragment, and htmx asks for it by name. Turn JavaScript
  off and every control here still works.
</p>

<!-- `submit` is in the trigger list because naming any trigger replaces the
     default, and for a form the default is submit. Leave it out and the Search
     button falls back to a whole-page navigation while everything else swaps. -->
<form
  class="search"
  method="get"
  action="/"
  role="search"
  hx-get="/"
  hx-target="#people"
  hx-swap="outerHTML"
  hx-trigger="input changed delay:200ms, search, submit"
  hx-push-url="true"
>
  <label for="q">Search</label>
  <input id="q" name="q" type="search" value="${q}" placeholder="ada, admiral…" autocomplete="off" />
  <button type="submit">Search</button>
</form>

<form id="add" class="add" method="post" hx-post="/?fragment=people" hx-target="#people" hx-swap="outerHTML">
  <label for="name">Name</label>
  <input id="name" name="name" placeholder="Name" required />
  <label for="role">Role</label>
  <input id="role" name="role" placeholder="Role" />
  <button type="submit">Add</button>
</form>

<!-- The fragment. The GET above carries no `?fragment=`: `hx-target="#people"`
     puts that id in the `HX-Target` header, and `fragmentHeader` in the config
     is what reads it.

     The three POSTs name it in the URL instead. Both mechanisms work, and the
     query parameter is the strict one: a name it does not know is a 404, so a
     request that changes data cannot quietly fall back to answering with a
     whole document.

     `hx-swap="outerHTML"` on every call, because a fragment arrives carrying
     its own id. htmx swaps `innerHTML` by default, which would put this
     `<ul id="people">` inside the one already on the page, and again on the
     next keystroke. -->
<ul id="people" fragment>
  <li each="person of people">
    <strong>${person.name}</strong>
    <span class="role">${person.role}</span>

    <form method="post" hx-post="/?fragment=people" hx-target="#people" hx-swap="outerHTML">
      <input type="hidden" name="intent" value="remove" />
      <input type="hidden" name="id" value="${person.id}" />
      <button class="destroy" type="submit" aria-label="Remove ${person.name}">×</button>
    </form>
  </li>

  <li class="empty" if="!people.length">Nobody matched.</li>

  <!-- The count is inside the fragment, because it changes. Anything that
       changes and sits outside keeps whatever the last whole-page render left
       there: the list would say four and the sentence above it three. -->
  <li class="count">${total} people, ${people.length} shown.</li>
</ul>

<script>
  // Clear the fields after a person is added. htmx swapped the list, and left
  // the form exactly as it was, which is right for a search box and wrong for
  // this one.
  //
  // A script block rather than an `hx-on` attribute, because the policy hashes
  // blocks and a hash never covers an attribute. Turn `csp` on with the handler
  // in an attribute and the browser refuses it, with nothing on the page to say
  // why.
  const add = document.querySelector('#add');

  add.addEventListener('htmx:afterRequest', (event) => {
    if (event.detail.successful) add.reset();
  });
</script>
