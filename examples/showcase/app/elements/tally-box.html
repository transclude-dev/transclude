   *
   * @typedef {{ label: string }} Props
   */

  /** @type {Props} */
  export default {
    label: "tally",
  };
</script>

<script state>
  /** @type {{ n: number }} */
  export default {
    n: 0,
  };
</script>

  }
</style>

<output>${n}</output>
<span>${label}</span>

  };
