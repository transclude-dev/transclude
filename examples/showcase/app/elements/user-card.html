<script properties>
  export default {
    name: 'Anonymous',
    role: '',
    /** @type {string[]} */
    tags: [],
    compact: false,
    since: new Date(0),
  };

  /**
   * How a prop crosses the attribute boundary when its type is not something
   * the default value could have described. An attribute is a string; a Date
   * is not, and JSON has no date either.
   */
  export const attributes = {
    since: {
      from: (text) => new Date(text),
      to: (date) => date.toISOString().slice(0, 10),
    },
  };

  // A shadow root, so this element re-renders when its attributes change.
  export const shadow = true;
</script>

<script state>
  // Not attributes. The document has no business knowing this, nothing outside
  // the element can set it, and it survives no further than the element does.
  export default { clicks: 0 };
</script>

<style>
  :host {
    display: block;
    border: 1px solid var(--line, #dcdce4);
    border-radius: 12px;
    padding: 1rem;
    background: #fff;
    cursor: pointer;
    transition: padding .12s ease;
  }
  :host([compact]) { padding: .55rem .75rem; }
  :host([compact]) .role,
  :host([compact]) ul { display: none; }

  h3 { margin: 0; font-size: 1rem; }
  .role { margin: .15rem 0 .6rem; color: #6b6b78; font-size: .85rem; }
  .since { margin: .15rem 0 .6rem; color: #a0a0ac; font-size: .75rem; }
  :host([compact]) .since { display: none; }
  .clicks { margin: .4rem 0 0; color: #a0a0ac; font-size: .72rem; }
  :host([compact]) .clicks { display: none; }
  .empty { margin: .15rem 0 0; color: #a0a0ac; font-size: .8rem; font-style: italic; }
  ul { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0; padding: 0; list-style: none; }
  li { background: #eef0ff; color: #3b3bb0; border-radius: 999px; padding: .1rem .55rem; font-size: .72rem; }
  ::slotted(em) { display: block; margin-top: .6rem; color: #8a8a96; font-size: .75rem; }
</style>
<h3>${name}</h3>
<p class="role" if="role">${role}</p>

<p class="since" if="since.getTime() > 0">since ${since.getUTCFullYear()}</p>

<p class="clicks" if="clicks">clicked ${clicks}&times;</p>

<template if="tags.length">
  <ul>
    <li each="tag of tags" key="tag">${tag}</li>
  </ul>
</template>
<p class="empty" else>no tags yet</p>

<slot></slot>

<script>
  // The element's public API. These land on the prototype, so they are shared
  // by every <user-card> and reach their own element through `this`. That is why
  // nothing in here can see `host`, `shadow` or `signal`. Those exist once per
  // element; a prototype exists once for the tag.
  export const prototype = {
    /**
     * Derived from the attribute, so there is no second copy of the state.
     * The return type is written out because another member reads it, and tsc
     * cannot infer a getter it is already in the middle of inferring.
     * @returns {number}
     */
    get tagCount() {
      return this.tags.length;
    },

    toggle() {
      this.compact = !this.compact;
      return this.compact;
    },

    addTag(tag) {
      if (!this.tags.includes(tag)) this.tags = [...this.tags, tag];
    },

    // Called after every render, and once on connect. The setup code below runs
    // on connect only, so this is the one place that can reach shadow content
    // knowing it is the current shadow content.
    updated() {
      const heading = this.shadowRoot.querySelector('h3');
      if (heading) heading.title = `${this.tagCount} tag(s)`;
    },
  };

  // Setup code. `host`, `shadow` and `signal` are in scope here, and this runs
  // once per element on connect. The listener is bound to the host, not to
  // shadow content, so it survives every re-render. `signal` takes it away when
  // the element leaves the document.
  //
  // A card used as a link has somewhere to be, so it does not also toggle:
  // two behaviors on one click is one too many, and replacing the shadow root
  // mid-click is a good way to lose the navigation.
  host.addEventListener(
    'click',
    () => {
      if (host.closest('a')) return;
      // Two assignments, one render. Both are collected into one microtask.
      host.clicks++;
      host.toggle();
    },
    { signal },
  );
</script>
