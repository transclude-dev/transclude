<script server>
  export const prerender = false;

  import { notes } from '../data/notes.js';

  export default async ({ action }) => ({
    notes: notes.all(),
    error: action?.error ?? null,
  });

  const save = async (request) => {
    const form = await request.formData();
    const text = String(form.get('text') ?? '').trim();
    if (!text) return { error: 'a note needs some text' };
    notes.add(text);
    return {};
  };

  export const POST = async ({ request, url, fragment }) => {
    const result = await save(request);
    if (result.error) return result;
    if (fragment !== null) return result;

    return Response.redirect(new URL(url), 303);
  };
</script>

<form method="post">
  <input name="text" />
  <button>Add</button>
</form>

<ul id="list" fragment>
  <li each="note of notes">${note}</li>
</ul>
