<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">






<style data-transclude="svg-icon">
@scope (svg-icon) {
  :scope {
      display: inline-flex;
      vertical-align: -0.125em;
    }
    svg {
      width: 1em;
      height: 1em;
    }
}
</style>
</head>
<body>

<svg aria-hidden="true"><use href="/icons.svg#chevron-down"></use></svg></svg-icon>
</button>

<svg aria-hidden="true"><use href="/lucide.svg#check"></use></svg></svg-icon>

<a href="/inbox"><svg-icon name="check" label="Inbox">




<svg role="img" aria-label="Inbox"><use href="/icons.svg#check"></use></svg></svg-icon></a>

</html>
