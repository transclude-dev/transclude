<style>
  /* The wordmark, drawn rather than set. It was `#transclude` in IBM Plex Mono
     Bold, tracked -0.03em, and the two paths below are those letters with the
     font taken away. The bold weight shipped for the mark and for nothing else,
     so the mark is what kept it.

     `scripts/fonts/` holds the file it came from. Drawing it again is that font,
     that text, that tracking, and the outlines at 1000 units to the em. */
  /* Inline, and the svg sits on the baseline, so this occupies the line box the
     text occupied. A block would be shorter than the line it replaced and every
     page would move up a few pixels. */
  :scope {
    display: inline;
    /* The size the mark was set at. Everything below is in `em`, so a caller
       that wants it larger sets a font-size and nothing else. */
    font-size: 1.45rem;
    color: var(--ink);
  }
  svg {
    /* 752 of the em's 1000 units are ink, from the top of the `#` to the
       overshoot under the `c`, and 12 of those sit below the baseline. */
    height: 0.752em;
    width: auto;
    vertical-align: -0.012em;
  }
  .hash {
    fill: var(--link);
  }
</style>
