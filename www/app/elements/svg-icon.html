<script properties>
  export default {
    // A file in `app/icons/`, without the extension. `check` draws
    // `app/icons/check.svg`.
    name: '',
    // What a screen reader says. Empty means the icon repeats its neighbor,
    // which is most of them, so it is hidden instead.
    label: '',
  };
</script>

<style>
  /* No fill and no stroke here. Each symbol carries the ones its own file
     declared, and an attribute on the symbol beats a value inherited from this
     side, so setting them here would win for some icon sets and lose for
     others. Size and color are the two this side owns. */
  :scope {
    display: inline-flex;
    vertical-align: -0.125em;
  }
  svg {
    width: 1em;
    height: 1em;
  }
</style>

<!-- Written twice rather than folded into one tag with three conditional
     attributes. A labelled icon and a decorative one are different elements to
     a screen reader, and the pair says which is which in one pass. -->
<svg if="label" role="img" aria-label="${label}"><use href="/icons.svg#${name}"></use></svg>
<svg else aria-hidden="true"><use href="/icons.svg#${name}"></use></svg>
