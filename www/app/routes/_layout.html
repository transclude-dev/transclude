<script server>
  // The site's outermost layout. It renders no chrome: the landing page and the
  // docs look nothing alike and each brings its own. What belongs here is what
  // every page needs and no page should have to remember, which is the icons and
  // the half of the sharing card that never varies.
  //
  // Layouts chain, so `docs/_layout.html` nests inside this one and both halves
  // of the site inherit whatever is added here.
  export default async ({ route, absolute }) => ({
    // Absolute, because a crawler does not resolve a relative one. `absolute`
    // reads `metadataBase`, which is right behind a proxy and while prerendering,
    // where there is no request to take an origin from.
    here: absolute(route.path),
    card: absolute('/og.png'),
  });
</script>

<!-- The theme, and the only script this site sends. It runs before the body
     parses, because a theme applied after it has already been seen.

     `data-appearance` is the theme on screen, light or dark, and it is the whole
     of what CSS reads. The reader's choice is a separate thing and lives in
     `localStorage`: `light`, `dark`, or absent, where absent means follow the
     system. So there are three states and the button in the bar draws two.

     Every click changes the theme on screen. The stored choice is dropped
     whenever storing nothing is what produces the theme being asked for, which
     is how a reader gets back to the system preference without a third button
     saying so. The system is read at the click and never listened to, so a
     laptop going dark at sunset does not quietly undo a choice.

     The listener is on the document rather than on the button, so the element
     ships no script of its own and the page loads no runtime.

     The mailed copy of a newsletter issue inherits this, the way it inherits the
     sharing card above. Seven hundred dead bytes there: a mail client runs no
     script, and most of them strip the tag before it is ever read. -->
<script head>
  {
    const root = document.documentElement;
    const system = () => (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const chosen = localStorage.getItem('theme');

    root.dataset.appearance = chosen === 'light' || chosen === 'dark' ? chosen : system();

    document.addEventListener('click', (event) => {
      if (!event.target.closest('theme-toggle')) return;

      const next = root.dataset.appearance === 'dark' ? 'light' : 'dark';

      if (next === system()) localStorage.removeItem('theme');
      else localStorage.setItem('theme', next);

      root.dataset.appearance = next;
    });
  }
</script>

<!-- `/favicon.ico` is requested with no link tag at all, so it needs none. These
     two do. The SVG carries its own dark-mode rule, since nothing on the page
     styles a file the browser fetches on its own. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<!-- The parts of a sharing card that are the same on every page. A title and a
     description are not among them, so each section supplies its own below, and
     what has none falls back to the page's `<title>` and `<meta name=description>`
     the way every crawler does.

     The newsletter inherits these, which is right for the web copy of an issue
     and four hundred dead bytes in the mailed one. Worth it: a link to an issue
     is a thing people share. -->
<meta property="og:site_name" content="transclude" />
<meta property="og:url" content="${here}" />
<meta property="og:image" content="${card}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta
  property="og:image:alt"
  content="The transclude wordmark above the line: HTML is the product."
/>
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="${card}" />

<slot></slot>
