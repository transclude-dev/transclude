<script server>
  import { confirm } from '../lib/subscribers.js';
  import { addContact } from '../lib/mail.js';

  // Reads a token off the query and writes to the database, so it is not a file.
  export const prerender = false;

  /**
   * Awaited, for the same reason the confirmation mail is.
   *
   * This was `ctx.after` and it is where the problem showed first: the row said
   * confirmed and Resend held no contact. Work handed to `waitUntil` is kept
   * alive on a best effort, and the audience is what every broadcast goes to, so
   * losing this is a subscriber who confirmed and then hears nothing ever again.
   *
   * D1 still holds the consent, so a failure here is recoverable by hand. It is
   * only recoverable by someone who knows, which is what the log is for.
   *
   * @param {string} email
   */
  async function addToAudience(email) {
    const { added, reason } = await addContact(email);
    if (!added && reason !== 'not configured' && reason !== 'already a contact') {
      console.error(`[confirm] ${email} confirmed but was not added to the audience: ${reason}`);
    }
  }

  /**
   * A GET that changes something, which is the one place that is normal: a mail
   * client cannot post, and the link in a confirmation mail has to be clickable.
   * The token is single use, so a prefetcher following it does what the reader
   * was going to do anyway.
   */
  export default async ({ url }) => {
    const token = new URL(url).searchParams.get('token') ?? '';
    const email = token ? await confirm(token) : null;

    // `confirm` answers with an address only on the move from pending to
    // confirmed, and the token is spent doing it. So this runs once per person
    // however many times the link is followed.
    if (email) await addToAudience(email);

    return { email };
  };
</script>

<title>${email ? 'Confirmed' : 'That link did not work'} · transclude</title>
<meta name="description" content="Confirming a subscription to the transclude notes." />

<site-shell>
  <doc-page
    heading="${email ? 'Confirmed' : 'That link did not work'}"
    lede="${email ? 'You are on the list.' : 'It may have been used already, or replaced by a newer one.'}"
  >
    <p if="email">
      Notes go out roughly monthly, and every one has an unsubscribe link in it.
    </p>

    <p else>
      Signing up again sends a fresh link, and the old one stops working the
      moment it does.
    </p>

    <p>
      <a href="/">Back to the front page</a> &middot;
      <a href="/blog">Writing</a> &middot; <a href="/feed.xml">Feed</a>
    </p>
  </doc-page>
</site-shell>
