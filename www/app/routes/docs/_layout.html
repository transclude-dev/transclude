<script server>
  import { versionHref, versionLabel } from '../../lib/version.js';

  // The nav lives here rather than in each page, so a new page is one file and
  // one line. `route.path` marks the current link.
  export default async ({ route, absolute }) => {
    const data = {
    // What these pages are documentation of. `after v0.6.0` when the deploy is
    // ahead of the release, which it is for most of the time between two.
    versionHref,
    versionLabel,
    path: route.path,
    canonical: absolute(route.path),
    sections: [
      {
        title: 'Start',
        links: [
          { href: '/docs', label: 'Overview' },
          { href: '/docs/why', label: 'Why transclude' },
          { href: '/docs/compared', label: 'Compared to other tools' },
          { href: '/docs/getting-started', label: 'Getting started' },
          { href: '/docs/project-layout', label: 'Project layout' },
        ],
      },
      {
        title: 'Routing',
        links: [
          { href: '/docs/routing', label: 'Pages and routes' },
          { href: '/docs/markdown', label: 'Markdown pages' },
          { href: '/docs/forms', label: 'Forms' },
          { href: '/docs/endpoints', label: 'Endpoints' },
          { href: '/docs/layouts', label: 'Layouts' },
        ],
      },
      {
        title: 'The page',
        links: [
          { href: '/docs/elements', label: 'Elements' },
          { href: '/docs/fragments', label: 'Fragments' },
          { href: '/docs/includes', label: 'Includes' },
          { href: '/docs/styles', label: 'Styles' },
          { href: '/docs/icons', label: 'Icons' },
        ],
      },
      {
        title: 'The server',
        links: [
          { href: '/docs/cookies', label: 'Cookies' },
          { href: '/docs/middleware', label: 'Middleware' },
          { href: '/docs/security', label: 'Security' },
          { href: '/docs/runtimes', label: 'Runtimes' },
        ],
      },
      {
        title: 'Reference',
        links: [
          { href: '/docs/testing', label: 'Testing' },
          { href: '/docs/production', label: 'The production build' },
          { href: '/docs/feeds', label: 'Sitemap and feeds' },
          { href: '/docs/types', label: 'Types' },
          { href: '/docs/config', label: 'Configuration' },
          { href: '/docs/decisions', label: 'Decisions and limits' },
          { href: '/docs/recipes', label: 'Recipes' },
          { href: '/docs/examples', label: 'Examples' },
          { href: '/docs/contributing', label: 'Contributing' },
          { href: '/docs/colophon', label: 'Colophon' },
        ],
      },
    ],
    };

    // Reading order is the nav's order, so a page added to the nav is in the
    // pager too and there is one list rather than two to keep in step.
    const flat = data.sections.flatMap((section) => section.links);
    const at = flat.findIndex((link) => link.href === data.path);

    return {
      ...data,
      prev: at > 0 ? flat[at - 1] : null,
      next: at !== -1 && at < flat.length - 1 ? flat[at + 1] : null,
      // The sharing title, out of the list that already names every page. A
      // second list of titles would be a second thing to keep true, and this
      // one is the nav, which cannot drift from itself.
      shared: at === -1 ? 'Documentation' : `${flat[at].label} · transclude`,
    };
  };
</script>

<title>transclude</title>
<link rel="canonical" href="${canonical}" />

<!-- No `og:description` here. Every page carries `<meta name="description">`,
     which is what a crawler reads when this is absent, and a second copy of the
     same sentence is a second copy to keep right. -->
<meta property="og:type" content="article" />
<meta property="og:title" content="${shared}" />

  @media (max-width: 56rem) {

</style>
