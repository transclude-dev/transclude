<script server>
  import { modules, files, stages } from '../../lib/source.js';

  // One page per module, rendered when asked for rather than written to 48
  // files. The data these read is in the server bundle either way, so
  // prerendering would carry the same source twice: once as `source.js`, and
  // again as the pages built from it. That was 0.77 MB gzip of the worker, for
  // a long tail most readers never open.
  //
  // `paths()` stays. Without `prerender` it no longer names what the build
  // writes, only what the URLs are, and that is what puts all 48 in the
  // sitemap. Rendering one is joining an array already in memory.
  export const prerender = false;
  export const paths = () => files.map((path) => ({ path }));

  export default async ({ params, response }) => {
    const file = params.path;
    const lines = modules[file];

    if (!lines) {
      response.status = 404;
      return { file, lines: [], named: [], missing: true };
    }

    // The stages that point into this file, so a reader arriving here from a
    // link knows which part of the story it belongs to.
    const named = stages
      .filter((stage) => stage.file === file)
      .map(({ title, symbol, line }) => ({ title, symbol, line }));

    return { file, lines, named, missing: false };
  };
</script>
