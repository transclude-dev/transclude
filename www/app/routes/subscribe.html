<script server>
  import { add, looksLikeEmail } from '../lib/subscribers.js';

  // It writes to a database and reads a query parameter, so it is not a file.
  export const prerender = false;

  const STATES = {
    check: {
      heading: 'Almost there',
      lede: 'Check your inbox and click the link to confirm.',
      body: 'Nothing is sent to an address that has not confirmed it wants mail.',
    },
    already: {
      heading: 'You are on the list',
      lede: 'That address is confirmed already.',
      body: 'Nothing further to do. The next note will reach you.',
    },
    invalid: {
      heading: 'That address did not look right',
      lede: 'Try it again?',
      body: 'Nothing was stored.',
    },
    nodb: {
      heading: 'Not here',
      lede: 'This copy of the site has no subscriber database.',
      body: 'Signing up works on transclude.dev. Locally it is a page and a form.',
    },
  };

  export default async ({ url }) => {
    const state = new URL(url).searchParams.get('state') ?? 'invalid';
    return { state: STATES[state] ?? STATES.invalid };
  };

  /**
   * Post, redirect, get. A reload after this re-runs the redirect rather than
   * the write, and the outcome is a URL that can be linked to.
   */
  export const POST = async ({ request, url }) => {
    // The request's own origin, not `absolute()`. That one resolves against
    // `metadataBase`, which is what a canonical link wants and would send a
    // form on localhost to the live site.
    const here = new URL(url).origin;

    const form = await request.formData();
    const email = String(form.get('email') ?? '')
      .trim()
      .toLowerCase();

    // The honeypot. A field no person can see and no person fills in, so
    // anything in it came from something reading the markup. Answered as if it
    // worked, because telling a bot it was caught is telling it what to change.
    if (String(form.get('website') ?? '')) {
      return Response.redirect(`${here}/subscribe?state=check`, 303);
    }

    if (!looksLikeEmail(email)) {
      return Response.redirect(`${here}/subscribe?state=invalid`, 303);
    }

    const source = String(form.get('source') ?? new URL(url).pathname);
    const { already } = await add(email, source);

    return Response.redirect(`${here}/subscribe?state=${already ? 'already' : 'check'}`, 303);
  };
</script>

<title>${state.heading} · transclude</title>
<meta name="description" content="Confirming a subscription to the transclude notes." />

<site-shell>
  <doc-page heading="${state.heading}" lede="${state.lede}">
    <p>${state.body}</p>

    <p>
      <a href="/">Back to the front page</a> &middot;
      <a href="/blog">Writing</a> &middot; <a href="/feed.xml">Feed</a>
    </p>
  </doc-page>
</site-shell>
