<script server>
  import { add, looksLikeEmail } from '../lib/subscribers.js';
  import { sendConfirmation } from '../lib/mail.js';
  import { withinLimit } from '../lib/limit.js';

  // It writes to a database and reads a query parameter, so it is not a file.
  export const prerender = false;

  /**
   * Awaited, not handed to `ctx.after`.
   *
   * It was `after` first, which is what that exists for: the reader does not
   * care about the mail API and should not wait on it. Measured, though, four
   * posts in a burst produced two sends and no errors. Work given to `waitUntil`
   * is kept alive on a best effort, and best effort is the wrong promise for the
   * only message this form exists to send. A subscriber who never gets it has no
   * way to ask again except to guess.
   *
   * So the reader waits for one API call, and finds out if it failed. `after` is
   * still the right tool for something nobody is owed.
   *
   * @param {{ email: string, token: string, origin: string }} about
   * @returns {Promise<boolean>} whether the mail is on its way
   */
  async function sendNow(about) {
    const { sent, reason } = await sendConfirmation(about);
    if (sent || reason === 'no key') return true;

    console.error(`[subscribe] confirmation to ${about.email} was not sent: ${reason}`);
    return false;
  }

  const STATES = {
    check: {
      heading: 'Almost there',
      lede: 'Check your inbox and click the link to confirm.',
      body: 'Nothing is sent to an address that has not confirmed it wants mail.',
    },
    already: {
      heading: 'You are on the list',
      lede: 'That address is confirmed already.',
      body: 'Nothing further to do. The next note will reach you.',
    },
    invalid: {
      heading: 'That address did not look right',
      lede: 'Try it again?',
      body: 'Nothing was stored.',
    },
    slow: {
      heading: 'Too many, too fast',
      lede: 'That was more signups from one place than this form takes.',
      body: 'Wait a minute and try again. Nothing was stored and nothing was sent.',
    },
    nomail: {
      heading: 'Stored, but the mail did not go',
      lede: 'Your address is on the list and the confirmation could not be sent.',
      body: 'Try again in a minute. Signing up twice is safe and sends a fresh link.',
    },
    nodb: {
      heading: 'Not here',
      lede: 'This copy of the site has no subscriber database.',
      body: 'Signing up works on transclude.dev. Locally it is a page and a form.',
    },
  };

  export default async ({ url }) => {
    const asked = new URL(url).searchParams.get('state');

    // Nothing asked for means nobody posted anything: a typed URL, a stale
    // link, a back button. Sending them to the form is the answer. It used to
    // fall through to `invalid`, which told a reader their address was wrong
    // when they had not given one.
    if (!asked) return Response.redirect(`${new URL(url).origin}/#notes`, 303);

    return { state: STATES[asked] ?? STATES.invalid };
  };

  /**
   * Post, redirect, get. A reload after this re-runs the redirect rather than
   * the write, and the outcome is a URL that can be linked to.
   */
  export const POST = async ({ request, url }) => {
    // The request's own origin, not `absolute()`. That one resolves against
    // `metadataBase`, which is what a canonical link wants and would send a
    // form on localhost to the live site.
    const here = new URL(url).origin;

    // Before the body is read and before anything is written. A flood costs a
    // send apiece under double opt-in, so the cheapest place to stop is first.
    if (!(await withinLimit(request))) {
      return Response.redirect(`${here}/subscribe?state=slow`, 303);
    }

    const form = await request.formData();
    const email = String(form.get('email') ?? '')
      .trim()
      .toLowerCase();

    // The honeypot. A field no person can see and no person fills in, so
    // anything in it came from something reading the markup. Answered as if it
    // worked, because telling a bot it was caught is telling it what to change.
    if (String(form.get('website') ?? '')) {
      return Response.redirect(`${here}/subscribe?state=check`, 303);
    }

    if (!looksLikeEmail(email)) {
      return Response.redirect(`${here}/subscribe?state=invalid`, 303);
    }

    const source = String(form.get('source') ?? new URL(url).pathname);
    const { token, already } = await add(email, source);

    // Confirmed already means no second mail and no new token.
    if (already) return Response.redirect(`${here}/subscribe?state=already`, 303);

    // The row is written either way. If the mail did not go, say so rather than
    // sending the reader to an inbox to wait for nothing.
    const sent = await sendNow({ email, token, origin: here });

    return Response.redirect(`${here}/subscribe?state=${sent ? 'check' : 'nomail'}`, 303);
  };
</script>

<title>${state.heading} · transclude</title>
<meta name="description" content="Confirming a subscription to the transclude notes." />

<site-shell>
  <doc-page heading="${state.heading}" lede="${state.lede}">
    <p>${state.body}</p>

    <p>
      <a href="/">Back to the front page</a> &middot;
      <a href="/blog">Writing</a> &middot; <a href="/feed.xml">Feed</a>
    </p>
  </doc-page>
</site-shell>
